name: Windows Qt6 preview build (disabled until migration parity)

# Intentionally disabled by project decision: no Windows binaries before the
# entire MCEdit2 feature migration and real-world validation are completed.
# Re-enable only after explicit approval. Manual dispatch also skips the job.
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: next-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-preview:
    if: ${{ false }} # Do not build experimental Windows artifacts during migration
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install editor and packager
        run: python -m pip install -e . pyinstaller
      - name: Build PySide6 app with physical built-in plugin sources
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --noconsole --name MCEdit2-Next `
            --add-data "modern/mcedit2_next/builtin_plugins;mcedit2_next/builtin_plugins" `
            scripts/launch_next.py
      - name: Check bundled plugin resources
        shell: pwsh
        run: |
          if (!(Test-Path "dist/MCEdit2-Next/_internal/mcedit2_next/builtin_plugins/selection_tools/plugin.toml")) {
            Get-ChildItem "dist/MCEdit2-Next" -Recurse -Filter plugin.toml | ForEach-Object { Write-Output $_.FullName }
            throw "Bundled plugins manifest missing"
          }
      - name: Smoke-test packaged entrypoint without opening a window
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/MCEdit2-Next/MCEdit2-Next.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList "--version" -PassThru -Wait
          Write-Output "Preview launcher exit code: $($process.ExitCode)"
          if ($process.ExitCode -ne 0) { throw "Packaged executable failed --version check" }
      - name: Smoke-test packaged Qt6 editor and built-in plugin menu
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $exe = (Resolve-Path "dist/MCEdit2-Next/MCEdit2-Next.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList "--selftest" -PassThru -Wait
          Write-Output "Bundled editor selftest exit code: $($process.ExitCode)"
          if ($process.ExitCode -ne 0) { throw "Bundled Qt6 editor startup selftest failed" }
      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/MCEdit2-Next" -DestinationPath "dist/MCEdit2-Next-Windows-x64-preview.zip" -Force
      - name: Upload experimental binary (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: MCEdit2-Next-Windows-x64-preview
          path: dist/MCEdit2-Next-Windows-x64-preview.zip
          retention-days: 7
