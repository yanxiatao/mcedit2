[package]
name = "mcedit2-world"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Read-only native Minecraft Java world and region indexing"

[dependencies]
flate2 = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
lz4_flex = "0.11"
xxhash-rust = { version = "0.8", features = ["xxh32"] }
